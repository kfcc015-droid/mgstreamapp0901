<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlphaHedge AI - 글로벌 주식 분석 에이전트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .prose h1 { font-size: 1.5rem; font-weight: 800; color: #38bdf8; margin: 1.25rem 0 0.5rem; border-bottom: 1px solid #374151; padding-bottom: 0.4rem; }
        .prose h2 { font-size: 1.2rem; font-weight: 700; color: #4ade80; margin: 1.2rem 0 0.4rem; }
        .prose h3 { font-size: 1rem; font-weight: 600; color: #e5e7eb; margin: 0.8rem 0 0.3rem; }
        .prose p, .prose li { color: #d1d5db; line-height: 1.6; font-size: 0.95rem; }
        .prose ul { list-style: disc; padding-left: 1.25rem; margin-bottom: 0.75rem; }
        .prose strong { color: #f9fafb; }
        .prose table { width: 100%; border-collapse: collapse; margin: 0.75rem 0; font-size: 0.875rem; }
        .prose th, .prose td { border: 1px solid #374151; padding: 0.5rem; text-align: left; }
        .prose th { background-color: #1f2937; color: #f3f4f6; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col p-4 sm:p-6 font-sans">
    <div class="max-w-4xl w-full mx-auto space-y-6">
        
        <!-- Header & API Key -->
        <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-gray-800">
            <div>
                <h1 class="text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-400">
                    📈 AlphaHedge AI
                </h1>
                <p class="text-xs text-gray-400">워런 버핏 & 피터 린치 관점의 주식 심층 분석</p>
            </div>
            <div class="flex items-center gap-2">
                <input type="password" id="apiKeyInput" placeholder="Gemini API Key (선택)"
                    class="bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-xs text-white focus:border-emerald-500 outline-none w-48 sm:w-56 font-mono">
                <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-xs text-emerald-400 hover:underline shrink-0">무료 키 발급</a>
            </div>
        </header>

        <!-- Search Input & Quick Tags -->
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 sm:p-5 space-y-3">
            <form id="analyzeForm" class="flex gap-2">
                <input type="text" id="tickerInput" required placeholder="종목명 또는 티커 (예: 삼성전자, NVDA, SK하이닉스, TSLA)"
                    class="flex-1 bg-gray-950 border border-gray-700 rounded-lg px-4 py-2.5 text-sm text-white focus:border-emerald-500 outline-none">
                <button type="submit" id="submitBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-5 py-2.5 rounded-lg text-sm transition shrink-0">
                    분석 실행
                </button>
            </form>
            <div class="flex flex-wrap gap-1.5 text-xs text-gray-400">
                <span class="text-gray-500 self-center">추천:</span>
                <button type="button" class="tag px-2.5 py-1 bg-gray-800 hover:bg-gray-700 rounded text-gray-300">삼성전자</button>
                <button type="button" class="tag px-2.5 py-1 bg-gray-800 hover:bg-gray-700 rounded text-gray-300">NVDA</button>
                <button type="button" class="tag px-2.5 py-1 bg-gray-800 hover:bg-gray-700 rounded text-gray-300">SK하이닉스</button>
                <button type="button" class="tag px-2.5 py-1 bg-gray-800 hover:bg-gray-700 rounded text-gray-300">TSLA</button>
                <button type="button" class="tag px-2.5 py-1 bg-gray-800 hover:bg-gray-700 rounded text-gray-300">AAPL</button>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="hidden text-center py-12 space-y-3">
            <div class="w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
            <p class="text-sm text-emerald-400 animate-pulse font-mono">재무 데이터 및 거장들의 관점 분석 중...</p>
        </div>

        <!-- Result Container -->
        <div id="resultCard" class="hidden bg-gray-900 border border-gray-800 rounded-xl p-5 sm:p-7 space-y-4">
            <div class="flex justify-between items-center pb-3 border-b border-gray-800">
                <span id="resultTicker" class="font-bold text-lg text-white"></span>
                <button id="copyBtn" class="px-3 py-1 bg-gray-800 hover:bg-gray-700 text-xs text-gray-200 rounded border border-gray-700">
                    리포트 복사
                </button>
            </div>
            <div id="output" class="prose"></div>
        </div>

    </div>

    <script>
        const apiKey = "";
        const SYSTEM_PROMPT = `당신은 워런 버핏(가치)과 피터 린치(성장)의 시각을 갖춘 30년 경력 헤지펀드 수석 애널리스트입니다.
입력받은 종목에 대해 객관적 재무/밸류에이션 데이터에 기반하여 아래 5단계 양식으로 명확히 분석하세요:
1. 📌 투자 의견 및 타겟 가격 (BUY/HOLD/SELL 중 택1, 현재가, 목표주가, 손절가, 3줄 요약)
2. 🏢 시장 및 산업 분석 (산업 성장성, 경제적 해자 강도 및 유형, 경쟁 우위)
3. 📈 재무 분석 및 밸류에이션 (최근 3개년 매출/영업이익/OCF 추이, PER/PBR 평가)
4. 🧠 거장들의 관점 분석 (워런 버핏의 가치투자 관점 & 피터 린치의 성장주 관점)
5. ⚠️ 주요 리스크 & 투자 체크포인트 (핵심 리스크 2가지 & 주가 촉매제)`;

        const apiKeyInput = document.getElementById('apiKeyInput');
        const tickerInput = document.getElementById('tickerInput');
        const analyzeForm = document.getElementById('analyzeForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const resultCard = document.getElementById('resultCard');
        const resultTicker = document.getElementById('resultTicker');
        const output = document.getElementById('output');
        const copyBtn = document.getElementById('copyBtn');

        // Local Storage API Key Load & Auto-Save
        apiKeyInput.value = localStorage.getItem('gemini_key') || '';
        apiKeyInput.addEventListener('input', () => localStorage.setItem('gemini_key', apiKeyInput.value.trim()));

        // Quick Tag Click
        document.querySelectorAll('.tag').forEach(btn => {
            btn.addEventListener('click', () => {
                tickerInput.value = btn.textContent;
                runAnalysis(btn.textContent);
            });
        });

        // Form Submit
        analyzeForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const ticker = tickerInput.value.trim();
            if (ticker) runAnalysis(ticker);
        });

        // Copy Markdown
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(output.innerText);
            copyBtn.textContent = '복사 완료!';
            setTimeout(() => copyBtn.textContent = '리포트 복사', 2000);
        });

        async function runAnalysis(ticker) {
            const key = apiKeyInput.value.trim() || apiKey;
            loading.classList.remove('hidden');
            resultCard.classList.add('hidden');
            submitBtn.disabled = true;

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview-09-2025:generateContent?key=${key}`;
            const payload = {
                contents: [{ parts: [{ text: `분석할 종목/티커: "${ticker}". 한글 종목명일 경우 상장 티커와 최신 실적을 반영하여 완전한 5단계 종합 리포트를 작성하세요.` }] }],
                systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] }
            };

            try {
                let res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error?.message || `HTTP ${res.status}`);
                }

                const data = await res.json();
                const text = data.candidates?.[0]?.content?.parts?.map(p => p.text).join('\n') || '';
                
                resultTicker.textContent = `📊 ${ticker.toUpperCase()} 분석 리포트`;
                output.innerHTML = marked.parse(text);
                resultCard.classList.remove('hidden');
            } catch (err) {
                alert(`오류 발생: ${err.message}\nAPI 키를 확인해 주세요.`);
            } finally {
                loading.classList.add('hidden');
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
